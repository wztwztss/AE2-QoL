/*
 * Add your dependencies here. Supported configurations:
 *  - api("group:name:version:classifier"): if you use the types from this dependency in the public API of this mod
 *       Available at runtime and compiletime for mods depending on this mod
 *  - implementation("g:n:v:c"): if you need this for internal implementation details of the mod, but none of it is visible via the public API
 *       Available at runtime but not compiletime for mods depending on this mod
 *  - compileOnly("g:n:v:c"): if the mod you're building doesn't need this dependency during runtime at all, e.g. for optional mods
 *       Not available at all for mods depending on this mod, only visible at compiletime for this mod
 *  - compileOnlyApi("g:n:v:c"): like compileOnly, but also visible at compiletime for mods depending on this mod
 *       Available at compiletime but not runtime for mods depending on this mod
 *  - runtimeOnlyNonPublishable("g:n:v:c"): if you want to include a mod in this mod's runClient/runServer runs, but not publish it as a dependency
 *       Not available at all for mods depending on this mod, only visible at runtime for this mod
 *  - devOnlyNonPublishable("g:n:v:c"): a combination of runtimeOnlyNonPublishable and compileOnly for dependencies present at both compiletime and runtime,
 *       but not published as Maven dependencies - useful for RFG-deobfuscated dependencies or local testing
 *  - runtimeOnly("g:n:v:c"): if you don't need this at compile time, but want it to be present at runtime
 *       Available at runtime for mods depending on this mod
 *  - annotationProcessor("g:n:v:c"): mostly for java compiler plugins, if you know you need this, use it, otherwise don't worry
 *  - testCONFIG("g:n:v:c") - replace CONFIG by one of the above (except api), same as above but for the test sources instead of main
 *
 *  - shadowImplementation("g:n:v:c"): effectively the same as API, but the dependency is included in your jar under a renamed package name
 *       Requires you to enable usesShadowedDependencies in gradle.properties
 *
 *  - compile("g:n:v:c"): deprecated, replace with "api" (works like the old "compile") or "implementation" (can be more efficient)
 *
 * You can exclude transitive dependencies (dependencies of the chosen dependency) by appending { transitive = false } if needed,
 * but use this sparingly as it can break using your mod as another mod's dependency if you're not careful.
 *
 * To depend on obfuscated jars you can use `devOnlyNonPublishable(rfg.deobf("dep:spec:1.2.3"))` to fetch an obfuscated jar from maven,
 * or `devOnlyNonPublishable(rfg.deobf(project.files("libs/my-mod-jar.jar")))` to use a file.
 *
 * Gradle names for some of the configuration can be misleading, compileOnlyApi and runtimeOnly both get published as dependencies in Maven, but compileOnly does not.
 * The buildscript adds runtimeOnlyNonPublishable to also have a runtime dependency that's not published.
 *
 * For more details, see https://docs.gradle.org/8.0.1/userguide/java_library_plugin.html#sec:java_library_configurations_graph
 */
dependencies {
    //runtimeOnlyNonPublishable("com.github.GTNewHorizons:NotEnoughItems:2.7.69-GTNH:dev")
    // 4.2.0（RC2）：依赖整体对齐 GTNH 2.9.0-RC-2 实机版本。
    // AE2 / AE2FC 的 RC2 版本（rv3-beta-1083 / 1.5.113）在 GTNH Maven 上无法解析（Cloudflare 525），
    // 因此改为「拷实例 mods 里的 jar 进 libs/ + rfg.deobf()」：既与实机字节码同版本，
    // 又保证编译期拿到 MCP 名（否则覆写 AE2 方法会因 SRG/MCP 不一致而静默失效）。
    implementation(rfg.deobf(project.files("libs/appliedenergistics2-rv3-beta-1083-GTNH.jar")))
    implementation("com.github.GTNewHorizons:NotEnoughItems:2.8.155-GTNH:dev") { transitive = false }
    implementation("codechicken:CodeChickenLib:1.7.10-1.1.3.136:dev@jar")
    implementation(rfg.deobf(project.files("libs/ae2fc-1.5.113-gtnh.jar")))
    // machindex（4.5.0）：BQ 从 3.8.84 升到实例实机版本 3.8.89。
    // 理由：取证读的是 3.8.89 源码（UUID 键库/属性系统/TaskRetrieval 字段），
    // 若编译基线仍停在 3.8.84，方案里的 API 判断会与编译期不一致，写出对不上的签名。
    // jar 由实例 mods 拷入并锁版本（SHA256 893fbec9…，非 Maven 解析）。
    compileOnly(project.files("libs/BetterQuesting-3.8.89-GTNH.jar"))
    // 吞并 AEInfinityCell 所需：源质通道 API + Avaritia halo 渲染接口(IHaloRenderItem)
    // 注意：这几条必须 transitive=false —— 新版 POM 会传递 GTNHLib/GTNHExtLib/lwjgl3ify，
    // 而本机离线 Gradle 缓存里没有这些具体版本；本模组源码并不 import GTNHLib，故不需要它们。
    compileOnly("com.github.GTNewHorizons:ThaumicEnergistics:1.7.60-GTNH:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:Avaritia:1.99:dev") { transitive = false }
    // Thaumcraft/EternalSingularity 无 dev 发布，本地发布版 jar 仅用于编译其自有 API/字段（不受 SRG 影响）
    compileOnly(project.files("libs/Thaumcraft-1.7.10-4.2.3.5.jar"))
    compileOnly(project.files("libs/eternalsingularity-1.4.3.jar"))
    compileOnly(project.files("libs/guidenh-1.3.41.jar"))
    implementation(project.files("libs/NotEnoughEnergistics-1.7.41.jar"))
    // 4.5.0-fix12：GTNL 2.9.0 正式实例为 dev-290 构建（libs/sciencenotleisure-dev-290.jar，
    // SHA256 f24749b4…，与实例 mods 的 sciencenotleisure-dev-290-*.jar 逐一字节一致）。
    // 相对 0.2.7-rc2 它把 SuperCraftingInputHatchMEGui 移入 gui.modularui.hatch 子包，
    // 编译基线必须同步换 jar，否则 mixin 按旧包名编译、运行时永不命中（静默失效）。
    // 判定口径以实机 jar 为准（参考源码 v0.2.3 比实机构建还旧）。
    compileOnly(project.files("libs/sciencenotleisure-dev-290.jar"))
    compileOnly(project.files("libs/gregtech-5.09.54.205.jar"))
    compileOnly(project.files("libs/modularui2-2.3.92-1.7.10.jar"))
    // 3.24.x：GTNH-MUI（com.gtnewhorizons.modularui）。整窗移植 WildcardPatternforGTNH 的界面需要它（对方也是
    // compileOnly + runtimeOnlyNonPublishable 这么声明的）。仅编译期需要，运行期由实例的 modularui-1.3.4.jar 提供。
    compileOnly(project.files("libs/modularui-1.3.4.jar"))
    compileOnly(project.files("libs/programmablehatches-0.2.0p31.jar"))
    compileOnly(project.files("libs/ae_wireless_nexus-1.0.2.jar"))
    // StructureLib（GT 依赖，万能维护仓需要 IAlignment 接口）
    compileOnly("com.github.GTNewHorizons:StructureLib:1.4.45:dev") { transitive = false }
    // 4.1.0 产线管理器：ServerUtilities 团队/声明区 API（jar 从实例 mods 拷入并锁版本；
    // modid=serverutilities 已用包内 mcmod.info 核对——坑 #18）
    compileOnly(project.files("libs/ServerUtilities-2.4.14.jar"))
    // RC2 显式补齐：把 AE2/AE2FC 换成 rfg.deobf(文件) 后就没有 POM 传递依赖了，
    // 而这两者在源码里真实使用（GTNHLib: CapabilityProvider；Waila: IWailaDataProvider），必须显式声明。
    compileOnly("com.github.GTNewHorizons:GTNHLib:0.11.52:dev") { transitive = false }
    compileOnly("com.github.GTNewHorizons:waila:1.19.34:dev") { transitive = false }
    // RC2：GT 5.09.54.x 起内部数学改用 JOML（GT jar 是文件依赖，没有 POM 传递，必须显式声明）
    compileOnly("org.joml:joml:1.10.8") { transitive = false }
    // 同上：AE2 1083 的 API 签名里出现 fastutil 类型（Reference2BooleanMap），文件依赖不带传递依赖
    compileOnly("it.unimi.dsi:fastutil:8.5.18") { transitive = false }
}
